name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by publish.yml so a release runs the exact same checks a PR does,
  # rather than a subset that can drift away from this file.
  workflow_call:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Node 22 LTS. It is the lower bound we support: jsdom 30 needs the undici
    # that ships with Node 22+, and anything passing here passes on 24.
    runs-on: ubuntu-latest
    # The whole suite runs in about a minute. Anything near this limit is hung,
    # and the default of six hours is a long time to hold up a release.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

      # Runs through examples/vite.config.ts, so it exercises the same alias and
      # dedupe as the dev server and the production build. Catches a duplicate
      # React reaching the demo, which builds cleanly and then throws on every
      # route that renders an arrow.
      - name: Test demo
        run: pnpm --filter react-xarrows-examples run test

      - name: Build
        run: pnpm run build

      # Compiles a consumer against the built lib/index.d.ts under every
      # supported @types/react major, with skipLibCheck off. Has to run after
      # the build, since the declarations are what it type checks. type-check
      # above cannot catch this: it checks src/ against the one React the root
      # has installed, and the demo resolves the library through a source alias,
      # so neither ever reads the published declarations. React 19 removing the
      # global JSX namespace broke them with both of those still green.
      - name: Type-test published declarations
        run: pnpm run test:types

      # The demo consumes the library straight from src, so it catches breakage
      # that the library's own build and tests do not.
      - name: Build demo
        run: pnpm --filter react-xarrows-examples run build

      # Catches the case where `files` or the build output drift apart and the
      # published tarball silently loses an entry point or its type definitions.
      # index.d.mts and index.d.cts are here because the exports map points the
      # per-condition `types` at them, and they come from a copy step in
      # vite.config.mts that would fail quietly. Paths are anchored so a
      # sourcemap cannot stand in for the file it maps.
      - name: Verify package contents
        run: |
          pnpm pack --pack-destination /tmp
          tar tzf /tmp/react-xarrows-*.tgz | sort
          for f in index.mjs index.cjs index.umd.js index.d.ts index.d.mts index.d.cts; do
            tar tzf /tmp/react-xarrows-*.tgz | grep -qx "package/lib/$f"
          done

      # Catches exports-map and declaration mismatches, such as an ESM entry
      # whose types still resolve as CommonJS.
      - name: Verify type resolution
        run: pnpm exec attw --pack . --format table

      # Listing a file is not the same as it working. The ESM and CJS entry
      # points are actually loaded here, because a bundler misconfiguration can
      # emit a file that only throws once imported.
      - name: Verify entry points load
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          tar xzf /tmp/react-xarrows-*.tgz
          npm init -y >/dev/null
          npm install ./package react@18 react-dom@18 >/dev/null
          node --input-type=module -e "
            import Xarrow, { Xwrapper, useXarrow } from 'react-xarrows';
            if (typeof Xarrow !== 'function') throw new Error('ESM default export is not a component');
            if (typeof Xwrapper !== 'function' || typeof useXarrow !== 'function') throw new Error('ESM named exports missing');
            console.log('ESM entry point OK');
          "
          node -e "
            const m = require('react-xarrows');
            if (typeof m.default !== 'function') throw new Error('CJS default export is not a component');
            if (typeof m.Xwrapper !== 'function' || typeof m.useXarrow !== 'function') throw new Error('CJS named exports missing');
            console.log('CJS entry point OK');
          "

      # The UMD bundle is the one output nothing else exercises, and its only
      # contract is the set of global names it reads. Getting one wrong produces
      # a bundle that loads and then fails on first use, so it is loaded here
      # against real globals.
      - name: Verify UMD bundle
        run: |
          cd /tmp/consumer
          node -e "
            const vm = require('node:vm'), fs = require('node:fs');
            // React is the only global the bundle reads. The package has no
            // runtime dependencies, so anything else here would mask a
            // regression that reintroduced one.
            const sandbox = { React: require('react'), console };
            vm.createContext(sandbox);
            vm.runInContext(fs.readFileSync('node_modules/react-xarrows/lib/index.umd.js', 'utf8'), sandbox);
            const umd = sandbox.reactXarrow;
            if (!umd || typeof umd.default !== 'function') throw new Error('UMD global reactXarrow missing or malformed');
            if (typeof umd.Xwrapper !== 'function' || typeof umd.useXarrow !== 'function') throw new Error('UMD named exports missing');
            console.log('UMD bundle OK');
          "
