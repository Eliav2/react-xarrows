name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life in April 2026, and jsdom 30 requires the
        # undici build that ships with Node 22 or newer.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Catches the case where `files` or the build output drift apart and the
      # published tarball silently loses the entry point or its type definitions.
      - name: Verify package contents
        run: |
          pnpm pack --pack-destination /tmp
          tar tzf /tmp/react-xarrows-*.tgz | sort
          tar tzf /tmp/react-xarrows-*.tgz | grep -q 'package/lib/index.js'
          tar tzf /tmp/react-xarrows-*.tgz | grep -q 'package/lib/index.d.ts'
